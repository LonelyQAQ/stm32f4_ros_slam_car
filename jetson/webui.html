<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SLAM 小车控制台</title>
<style>
  :root { --bg:#15181e; --panel:#1d222b; --line:#2b3240; --fg:#d8dee9; --dim:#8b95a7; --acc:#4fa3ff; --warn:#ffb020; --ok:#48d597; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
               font:13px/1.45 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  #app { display:flex; height:100%; }
  #left { flex:1; position:relative; min-width:0; }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  #hud { position:absolute; left:12px; top:12px; background:rgba(20,24,31,.82);
         border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-variant-numeric:tabular-nums; }
  #hud b { color:var(--acc); font-weight:600; }
  #hint { position:absolute; left:12px; bottom:12px; color:var(--dim); font-size:12px;
          background:rgba(20,24,31,.75); padding:6px 10px; border-radius:8px; }
  #side { width:320px; border-left:1px solid var(--line); background:var(--panel);
          display:flex; flex-direction:column; overflow-y:auto; }
  .sec { padding:12px 14px; border-bottom:1px solid var(--line); }
  .sec h3 { margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  button { background:#273040; color:var(--fg); border:1px solid var(--line); border-radius:7px;
           padding:8px 10px; font-size:13px; cursor:pointer; }
  button:hover { border-color:#3d4a60; background:#2d3850; }
  button:active { transform:translateY(1px); }
  button.warn { border-color:#6a4a12; }
  button.stop { background:#4a1f22; border-color:#6b2b2f; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .row label { flex:0 0 54px; color:var(--dim); }
  .row input[type=range] { flex:1; }
  .row .val { flex:0 0 62px; text-align:right; font-variant-numeric:tabular-nums; }
  .kv { display:flex; justify-content:space-between; padding:2px 0; font-variant-numeric:tabular-nums; }
  .kv span:first-child { color:var(--dim); }
  #toast { margin-top:8px; min-height:18px; color:var(--ok); font-size:12px; }
  #log { font-family:ui-monospace, Consolas, monospace; font-size:11px; color:var(--dim);
         max-height:120px; overflow-y:auto; white-space:pre-wrap; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:#555; }
  .dot.on { background:var(--ok); }
  .dot.warn { background:var(--warn); }
  kbd { background:#2b3240; border:1px solid #3a4457; border-bottom-width:2px; border-radius:4px;
        padding:1px 6px; font-family:inherit; font-size:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <canvas id="view"></canvas>
    <div id="hud">
      <div>位姿 <b id="pose">-</b></div>
      <div>速度 <b id="spd">-</b></div>
      <div>IMU <b id="imu">-</b></div>
    </div>
    <div id="hint">WASD 行驶 · 滚轮缩放 · 拖动平移 · 点击地图设导航目标</div>
  </div>

  <div id="side">
    <div class="sec">
      <h3>行驶控制</h3>
      <div class="row"><label>线速度</label><input id="lin" type="range" min="0.05" max="0.35" step="0.01" value="0.15"><span class="val" id="linv">0.15</span></div>
      <div class="row"><label>角速度</label><input id="ang" type="range" min="0.1" max="1.2" step="0.05" value="0.5"><span class="val" id="angv">0.50</span></div>
      <div class="grid3" style="margin-top:8px">
        <button id="bF">▲ 前进</button>
        <button id="bL">◀ 左转</button>
        <button id="bR">右转 ▶</button>
      </div>
      <div class="grid2" style="margin-top:8px">
        <button id="bB">▼ 后退</button>
        <button id="bStop" class="stop">■ 急停</button>
      </div>
      <div style="margin-top:6px;color:var(--dim);font-size:12px">键盘 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 同样有效</div>
    </div>

    <div class="sec">
      <h3>导航</h3>
      <div class="grid2">
        <button id="bMode">手动模式</button>
        <button id="bHome">返航原点</button>
      </div>
      <div class="grid2" style="margin-top:8px">
        <button id="bSetHome">设为原点</button>
        <button id="bNavCancel">取消导航</button>
      </div>
      <div class="grid2" style="margin-top:8px">
        <button id="bNavStart">启动 Nav2</button>
        <button id="bNavStop" class="warn">关闭 Nav2</button>
      </div>
      <div class="kv" style="margin-top:8px"><span>状态</span><span id="navState">-</span></div>
      <div class="kv"><span>剩余</span><span id="navDist">-</span></div>
      <div class="kv"><span>原点</span><span id="homePose">-</span></div>
      <div class="kv"><span>距原点</span><span id="homeDist">-</span></div>
      <div class="kv"><span>末次误差</span><span id="homeErr">-</span></div>
      <div class="kv"><span>安全层</span><span id="safetyState">-</span></div>
      <div style="color:var(--dim);font-size:12px;margin-top:6px">点击地图设目标；手动/自动互斥</div>
    </div>

    <div class="sec">
      <h3>建图</h3>
      <div class="grid2">
        <button id="bStart">开始建图</button>
        <button id="bFinish">建图完成</button>
      </div>
      <div class="grid2" style="margin-top:8px">
        <button id="bKill" class="warn">停止节点</button>
      </div>
      <div class="row" style="margin-top:8px">
        <select id="mapSel" style="flex:1;background:#273040;color:#d8dee9;border:1px solid #2b3240;border-radius:7px;padding:7px"></select>
      </div>
      <div class="grid3" style="margin-top:8px">
        <button id="bUseMap">使用</button>
        <button id="bCheck">校验</button>
        <button id="bDelMap" class="warn">删除</button>
      </div>
      <button id="bReloc" style="margin-top:8px;width:100%">重新全局定位</button>
      <button id="bInitPose" style="margin-top:8px;width:100%">设初始位姿（点击地图）</button>
      <div class="kv" style="margin-top:8px"><span>状态</span><span id="slamState">-</span></div>
    </div>

    <div class="sec">
      <h3>IMU</h3>
      <div class="grid2">
        <button id="bImuZero">设为零位</button>
        <button id="bImuClear">清除零位</button>
      </div>
      <div class="kv" style="margin-top:8px"><span>roll / pitch / yaw</span><span id="imuAbs">-</span></div>
      <div style="color:var(--dim);font-size:12px;margin-top:6px">仅显示层置零，不改 MCU 零偏</div>
    </div>

    <div class="sec">
      <h3>数据</h3>
      <div class="kv"><span>激光</span><span id="dScan">-</span></div>
      <div class="kv"><span>地图</span><span id="dMap">-</span></div>
      <div class="kv"><span>指令</span><span id="dCmd">-</span></div>
      <div id="toast"></div>
    </div>

    <div class="sec" style="flex:1">
      <h3>日志</h3>
      <div id="log">-</div>
    </div>
  </div>
</div>

<script src="/webui.js"></script>
</body>
</html>
